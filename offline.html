<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayFair - Offline</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f3f4f6;
        }
        .offline-container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        h1 {
            color: #dc2626;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .status {
            padding: 1rem;
            background: #fef3c7;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            color: #92400e;
        }
        .actions {
            display: flex;
            gap: 1rem;
            flex-direction: column;
        }
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary {
            background: #1e3a8a;
            color: white;
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #1e3a8a;
            color: #1e3a8a;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection.</p>
        
        <div class="status">
            <p><strong>Don't worry!</strong> Your changes will sync automatically when you reconnect.</p>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="checkConnection()">Check Connection</button>
            <button class="btn-secondary" onclick="viewCachedContent()">View Cached Content</button>
        </div>

        <p style="margin-top: 2rem; font-size: 0.875rem;">
            <strong>Cached Features Available:</strong>
            <ul style="text-align: left; color: #6b7280;">
                <li>View your profile</li>
                <li>Review past rides</li>
                <li>Access saved routes</li>
                <li>Read offline guides</li>
            </ul>
        </p>
    </div>

    <script>
        function checkConnection() {
            if (navigator.onLine) {
                alert('You are back online! Refreshing...');
                location.reload();
            } else {
                alert('Still offline. Please check your connection.');
            }
        }

        function viewCachedContent() {
            alert('Loading cached content...');
            // Load from cache
            history.back();
        }

        // Check connection status
        window.addEventListener('online', () => {
            alert('Connection restored! Redirecting...');
            location.href = '/';
        });

        // Auto-check every 5 seconds
        setInterval(() => {
            if (navigator.onLine) {
                document.querySelector('.status').innerHTML = 
                    '<p style="color: #065f46;">✓ You are back online! Redirecting...</p>';
                setTimeout(() => location.href = '/', 2000);
            }
        }, 5000);
    </script>
</body>
</html>
