<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayFair - Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="logo">WayFair</div>
            <ul class="nav-links">
                <li><a href="./dashboard.html">Dashboard</a></li>
                <li><a href="./profile.html">Profile</a></li>
                <li><a href="./referral.html">Referral</a></li>
                <li><a href="../index.html" class="logout">Logout</a></li>
            </ul>
        </nav>

        <div class="dashboard-content">
            <h1>Welcome to Your Dashboard</h1>
            <div class="dashboard-grid">
                <div class="dashboard-card" id="search-rides">
                    <h3>Search Rides</h3>
                    <p>Find available rides</p>
                </div>
                <div class="dashboard-card" id="my-rides">
                    <h3>My Rides</h3>
                    <p>Your booking history</p>
                </div>
                <div class="dashboard-card" id="create-ride">
                    <h3>Create Ride</h3>
                    <p>Offer a ride</p>
                </div>
                <div class="dashboard-card" id="my-bookings">
                    <h3>My Bookings</h3>
                    <p>Active and past bookings</p>
                </div>
                <div class="dashboard-card" id="explorer">
                    <h3>Explorer</h3>
                    <p>View blockchain data</p>
                </div>
                <div class="dashboard-card" id="chat">
                    <h3>Messages</h3>
                    <p>Chat with users</p>
                </div>
            </div>
        </div>
    </div>
    <script src="../scripts/app.js"></script>
</body>
</html>
